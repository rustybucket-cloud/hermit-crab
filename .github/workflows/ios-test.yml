# TEMPORARY: a dry run of ios.yml on this branch. Remove before merging.
name: iOS update or release (dry run)

on:
  push:
    branches: [ios-live-updates]

jobs:
  check:
    name: Compare with the last release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # A local tag standing in for the latest App Store Connect build, which predates live updates.
      - name: Compare native code
        run: |
          git tag -a ios/build/1 -m none
          version=$(pnpm --reporter silent run ios:version)
          native=${version##*-}
          tag=$(git tag --list 'ios/build/*' --sort=-version:refname | head -1)
          released=$(git tag --list --format='%(contents:subject)' "$tag")
          echo "version $version, latest tag $tag ($released), next build $(( ${tag#ios/build/} + 1 ))"
          if [ "$native" = "$released" ]; then echo "→ would publish an update"; else echo "→ would release a build"; fi

  update:
    name: Publish a live update (fake gh)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Stand in for gh
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "gh $*" >&2
          case "$1 $2" in
            "auth status") exit 0 ;;
            "release download") exit 1 ;;
            "release view") [[ " $* " == *" --json "* ]] && exit 0; exit 1 ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/bin/gh"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Publish
        run: pnpm ios:update

      - run: cat out/ios-update/ios-web.json && ls -l out/ios-update

  release:
    name: Build and sign for App Store Connect (no upload)
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - name: Check for secrets
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DEV_CERT_P12; do
            if [ -z "${!name}" ]; then
              echo "::error::Add a $name repository secret (see BUILDING.md)."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/"AuthKey_$ASC_KEY_ID.p8"

      - name: Install signing certificate
        env:
          IOS_DEV_CERT_P12: ${{ secrets.IOS_DEV_CERT_P12 }}
          IOS_DEV_CERT_PASSWORD: ${{ secrets.IOS_DEV_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          printf '%s' "$IOS_DEV_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_DEV_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$keychain"

      # Signs for App Store distribution the same way, but writes the .ipa here instead of uploading it.
      - name: Build and export
        run: |
          sed -i '' 's|<string>upload</string>|<string>export</string>|' scripts/ios-release.sh
          pnpm ios:release 9999

      - name: Check what was built
        run: |
          config=ios/release/HermitCrab.xcarchive/Products/Applications/App.app/capacitor.config.json
          built=$(node -p 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).plugins.CapacitorUpdater.version' "$config")
          expected=$(pnpm --reporter silent run ios:version)
          echo "built $built, expected $expected"
          [ "${built##*-}" = "${expected##*-}" ]
          ls -l ios/release/*.ipa
          codesign -dvv ios/release/HermitCrab.xcarchive/Products/Applications/App.app 2>&1 | grep -E "Authority|TeamIdentifier"
